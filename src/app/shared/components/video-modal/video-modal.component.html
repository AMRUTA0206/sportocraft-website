<div class="video-modal-overlay" *ngIf="isOpen" (click)="closeModal()">
  <div class="video-modal-content" (click)="$event.stopPropagation()">
    <button class="modal-close" (click)="closeModal()" aria-label="Close video">
      ×
    </button>

    <video
      #videoElement
      class="modal-video"
      controls
      controlsList="nodownload"
      [poster]="video?.poster"
      preload="metadata"
    >
      <source *ngIf="video?.src" [src]="video.src" type="video/mp4" />
      Your browser does not support the video tag.
    </video>

    <div class="video-details" *ngIf="video">
      <h2>{{ video.title }}</h2>
      <p>{{ video.description }}</p>
    </div>
  </div>
</div>
