<div class="lightbox-overlay" *ngIf="isOpen" (click)="close()" (keydown)="onKeyDown($event)" tabindex="0">
  <div class="lightbox-content" (click)="$event.stopPropagation()">
    <img
      *ngIf="currentImage"
      [src]="currentImage.src"
      [alt]="currentImage.alt"
      class="lightbox-image"
      loading="lazy"
    />

    <button class="lightbox-close" (click)="close()" aria-label="Close lightbox">
      ×
    </button>

    <button class="lightbox-prev" (click)="previous()" aria-label="Previous image">
      ‹
    </button>

    <button class="lightbox-next" (click)="next()" aria-label="Next image">
      ›
    </button>

    <div class="lightbox-info">
      <div *ngIf="currentImage" class="info-text">
        <p>{{ currentImage.title }}</p>
        <span>{{ currentIndex + 1 }} / {{ images.length }}</span>
      </div>
    </div>
  </div>
</div>
